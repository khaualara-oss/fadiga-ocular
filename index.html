<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teste com Registro e Atalho Enter</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 600px;
            margin: 40px auto;
            padding: 20px;
            background-color: #f4f4f9;
            color: #333;
        }
        .card {
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            margin-bottom: 20px;
        }
        .form-group {
            margin-bottom: 15px;
            text-align: left;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }
        input, select {
            width: 100%;
            padding: 10px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 4px;
        }
        button {
            background-color: #007acc;
            color: white;
            border: none;
            padding: 10px 20px;
            font-size: 16px;
            border-radius: 4px;
            cursor: pointer;
            width: 100%;
        }
        button:hover {
            background-color: #005999;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
        }
        th, td {
            border: 1px solid #ddd;
            padding: 8px;
            text-align: left;
        }
        th {
            background-color: #007acc;
            color: white;
        }
        .hint {
            font-size: 0.85em;
            color: #666;
            margin-top: 5px;
        }
    </style>
</head>
<body>

    <div class="card">
        <h2>Formulário de Teste</h2>
        <form id="testeForm">
            <div class="form-group">
                <label for="nome">Nome:</label>
                <input type="text" id="nome" required placeholder="Digite seu nome">
            </div>
            
            <div class="form-group">
                <label for="resposta">Resultado do Teste:</label>
                <select id="resposta" required>
                    <option value="">Selecione uma opção...</option>
                    <option value="Aprovado">Aprovado</option>
                    <option value="Pendente">Pendente</option>
                    <option value="Reprovado">Reprovado</option>
                </select>
            </div>

            <button type="submit">Enviar (ou pressione Enter)</button>
            <p class="hint">Pressione <strong>Enter</strong> em qualquer campo para enviar o formulário.</p>
        </form>
    </div>

    <div class="card">
        <h3>Histórico de Acessos / Testes Salvos</h3>
        <table>
            <thead>
                <tr>
                    <th>Data / Hora</th>
                    <th>Nome</th>
                    <th>Status</th>
                </tr>
            </thead>
            <tbody id="tabelaRegistros">
            </tbody>
        </table>
        <br>
        <button onclick="limparHistorico()" style="background-color: #d9534f;">Limpar Histórico</button>
    </div>

    <script>
        const form = document.getElementById('testeForm');
        const tabelaRegistros = document.getElementById('tabelaRegistros');

        // Carrega os dados salvos no localStorage ao abrir a página
        document.addEventListener('DOMContentLoaded', carregarRegistros);

        // Permite avançar/submeter pressionando a tecla Enter
        form.addEventListener('keydown', function(event) {
            if (event.key === 'Enter') {
                event.preventDefault(); // Impede a ação padrão de quebra de linha
                form.requestSubmit();   // Aciona o envio do formulário
            }
        });

        // Evento ao enviar o formulário
        form.addEventListener('submit', function(event) {
            event.preventDefault();

            const nome = document.getElementById('nome').value;
            const resposta = document.getElementById('resposta').value;
            const dataHora = new Date().toLocaleString('pt-BR');

            const novoRegistro = { dataHora, nome, resposta };

            // Salva no localStorage
            salvarNoLocalStorage(novoRegistro);

            // Atualiza a tabela na tela
            carregarRegistros();

            // Limpa o formulário e foca novamente no campo de nome
            form.reset();
            document.getElementById('nome').focus();
        });

        function salvarNoLocalStorage(registro) {
            let registros = JSON.parse(localStorage.getItem('registrosTeste')) || [];
            registros.push(registro);
            localStorage.setItem('registrosTeste', JSON.stringify(registros));
        }

        function carregarRegistros() {
            tabelaRegistros.innerHTML = '';
            let registros = JSON.parse(localStorage.getItem('registrosTeste')) || [];

            registros.forEach(function(item) {
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td>${item.dataHora}</td>
                    <td>${item.nome}</td>
                    <td>${item.resposta}</td>
                `;
                tabelaRegistros.appendChild(tr);
            });
        }

        function limparHistorico() {
            localStorage.removeItem('registrosTeste');
            carregarRegistros();
        }
    </script>

</body>
</html>
