<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minha Primeira Página</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            color: #333;
            margin: 0;
            padding: 20px;
            text-align: center;
        }
        header {
            background-color: #007acc;
            color: white;
            padding: 20px 0;
            border-radius: 8px;
        }
        main {
            margin-top: 20px;
        }
        button {
            background-color: #007acc;
            color: white;
            border: none;
            padding: 10px 20px;
            font-size: 16px;
            border-radius: 5px;
            cursor: pointer;
        }
        button:hover {
            background-color: #005999;
        }
    </style>
</head>
<body>

    <header>
        <h1>Bem-vindo ao Meu Site!</h1>
    </header>

    <main>
        <p>Este é um modelo básico de página HTML criado para o Visual Studio Code.</p>
        <button onclick="mensagem()">Clique aqui</button>
    </main>

    <script>
        function mensagem() {
            alert('Olá! Seu código HTML e JavaScript está funcionando perfeitamente.');
        }
    </script>

</body>
</html>
